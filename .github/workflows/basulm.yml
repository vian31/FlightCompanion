name: BASULM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"  # le lundi à 4 h UTC

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mode exploration : la réponse brute de listall est uploadée en
      # artifact et n'est PAS commitée dans le dépôt.
      - name: Récupérer listall (un seul appel)
        env:
          BASULM_API_KEY: ${{ secrets.BASULM_API_KEY }}
        run: python3 scripts/fetch_basulm.py "$RUNNER_TEMP/basulm_listall.json"

      - name: Uploader la réponse brute
        uses: actions/upload-artifact@v4
        with:
          name: basulm-listall
          path: ${{ runner.temp }}/basulm_listall.json
          if-no-files-found: error
          retention-days: 14
