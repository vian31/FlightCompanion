<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mémo</title>
<style>
  :root {
    --ink: #17140f;
    --paper: #f6f2e9;
    --accent: #3b5c47;
    --accent-soft: #e3ead9;
    --muted: #8a8172;
    --brown: #7a4a22;
    --line: #e7e0d1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header {
    padding: 20px 22px 0;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 22px 40px;
  }

  /* ---- QNH bandeau ---- */
  .qnh {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--accent);
    color: var(--paper);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 18px;
  }
  .qnh .lbl {
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .qnh .val {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .qnh .val .u { font-size: 20px; font-weight: 600; opacity: 0.8; margin-left: 4px; }
  .qnh .meta {
    flex: 1;
    font-size: 16px;
    line-height: 1.45;
    opacity: 0.85;
    text-align: right;
  }
  .qnh .meta .stn { font-weight: 700; opacity: 1; letter-spacing: 0.03em; }
  .qnh.err { background: #8a3b2f; }
  .qnh.load .val { opacity: 0.5; }
  .qnh .refresh {
    background: rgba(255,255,255,0.16);
    border: none;
    color: var(--paper);
    width: 45px; height: 45px;
    border-radius: 10px;
    font-size: 35px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .qnh .refresh:active { background: rgba(255,255,255,0.3); }
  .qnh .meta em { font-style: italic; }

  /* ---- Bloc mémo (texte mis en forme) ---- */
  .memo { margin-bottom: 26px; }
  .memo h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 20px 0 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent-soft);
  }
  .memo h2:first-child { margin-top: 0; }
  .memo h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin: 14px 0 4px;
  }
  .memo p { font-size: 16px; line-height: 1.55; margin: 6px 0; }
  .memo ul { list-style: none; margin: 6px 0; }
  .memo li {
    font-size: 16px;
    line-height: 1.5;
    padding-left: 18px;
    position: relative;
    margin: 4px 0;
  }
  .memo li::before {
    content: "•";
    color: var(--accent);
    position: absolute;
    left: 4px;
    font-weight: 700;
  }
  .memo .encart {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 12px 0;
  }
  .memo .encart p { font-size: 16px; margin: 4px 0; }
  .memo .encart .sub { font-weight: 700; margin-top: 8px; }
  .memo .encart .sub:first-child { margin-top: 0; }
  .memo .annonce {
    color: var(--brown);
    font-weight: 700;
    font-size: 16px;
    margin: 6px 0;
  }
  .memo b { font-weight: 700; }
  .memo i { font-style: italic; }

  /* ---- Zone de saisie tactile ---- */
  .note-wrap { margin-bottom: 10px; }
  .note-wrap .cap {
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .note-wrap .clr {
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--brown);
    text-transform: none;
    cursor: pointer;
  }
  textarea.note {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;   /* >=16px : évite le zoom auto iOS au focus */
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }
  textarea.note:focus { border-color: var(--accent); }
</style>
</head>
<body>
  <header><h1>Mémo</h1></header>

  <div class="scroll">

    <!-- QNH local automatique -->
    <div class="qnh load" id="qnh">
      <div>
        <div class="lbl">QNH local</div>
        <div class="val" id="qnhVal">––––<span class="u">hPa</span></div>
      </div>
      <div class="meta" id="qnhMeta">Localisation…</div>
      <button class="refresh" id="qnhRefresh" title="Actualiser">⟳</button>
    </div>

    <!-- Texte mis en forme depuis le bloc éditable en tête de code -->
    <div class="memo" id="memo"></div>

    <!-- Zone de saisie tactile libre -->
    <div class="note-wrap">
      <div class="cap"><span>Notes</span><span class="clr" id="clrNote">effacer</span></div>
      <textarea class="note" id="note" placeholder="Saisie libre au doigt…"></textarea>
    </div>

  </div>

<script>
/* ============================================================
   1) TEXTE DU MÉMO — éditable ici, en tête de code.
   Marqueurs (mêmes principes que la check-list) :
     #  titre de section
     ~  sous-titre
     >  encart informatif (bloc)
     *  sous-titre gras dans un encart
     !  ligne annoncée (brun / gras)
     -  puce
     (ligne nue)  paragraphe
     ligne vide   séparateur
   En ligne : *gras* et _italique_
   ============================================================ */
const MEMO_TEXT = `
# Départ Muret

~ Rappels avant vol

- Fréquence Muret : *124.58* MHz
- Tour de piste : main gauche 12 / main droite 30
- Vérifier NOTAM et activité planeurs

> Sécurité
* Panne avant VR
Réduire, poser devant, droit devant.
* Panne après VR
Assiette de plané, ne pas revenir au terrain.

! Altimètre calé au QNH avant alignement

~ Contacts

- SIV Toulouse : 121.25
- A/A Muret : 124.58
`;

/* ---- mini-parseur des marqueurs ---- */
function inline(s) {
  // échappe le HTML
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // *gras*  et  _italique_
  s = s.replace(/\*(.+?)\*/g, '<b>$1</b>');
  s = s.replace(/_(.+?)_/g, '<i>$1</i>');
  return s;
}

function renderMemo(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  let html = '';
  let inList = false, inEncart = false;

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const closeEncart = () => { if (inEncart) { closeList(); html += '</div>'; inEncart = false; } };

  for (let raw of lines) {
    const line = raw.trim();

    if (line === '') { closeList(); continue; }

    const c = line[0];
    const rest = line.slice(1).trim();

    if (c === '#') { closeEncart(); closeList(); html += '<h2>' + inline(rest) + '</h2>'; }
    else if (c === '~') { closeEncart(); closeList(); html += '<h3>' + inline(rest) + '</h3>'; }
    else if (c === '>') { closeList(); if (!inEncart) { html += '<div class="encart">'; inEncart = true; } html += '<p>' + inline(rest) + '</p>'; }
    else if (c === '*') { closeList(); if (!inEncart) { html += '<div class="encart">'; inEncart = true; } html += '<p class="sub">' + inline(rest) + '</p>'; }
    else if (c === '!') { closeList(); html += '<p class="annonce">' + inline(rest) + '</p>'; }
    else if (c === '-') { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(rest) + '</li>'; }
    else { closeList(); html += '<p>' + inline(line) + '</p>'; }
  }
  closeEncart(); closeList();
  return html;
}

document.getElementById('memo').innerHTML = renderMemo(MEMO_TEXT);


/* ============================================================
   2) QNH LOCAL — géolocalisation + Open-Meteo
   Source : api.open-meteo.com (gratuit, sans clé, en-têtes CORS OK
   → appelable directement depuis https://…github.io).
   Champ : current.pressure_msl = pression réduite au niveau mer
   ≈ QNH (hPa). Valeur MODÉLISÉE à la position, indicative :
   pour un calage réglementaire, référence = METAR/ATIS du terrain.
   ============================================================ */
const qnhBox  = document.getElementById('qnh');
const qnhVal  = document.getElementById('qnhVal');
const qnhMeta = document.getElementById('qnhMeta');

function setQnh(hpa, ageMin, place) {
  qnhBox.classList.remove('load', 'err');
  qnhVal.innerHTML = Math.round(hpa) + '<span class="u">hPa</span>';
  const ageTxt = ageMin != null ? (ageMin < 1 ? "à l'instant" : 'il y a ' + ageMin + ' min') : '';
  const placeTxt = place ? '<span class="stn">' + place + '</span>' : '<span class="stn"><em>indicatif</em></span>';
  qnhMeta.innerHTML = placeTxt +
                      (place ? '<br><em>indicatif</em>' : '') +
                      (ageTxt ? '<br>' + ageTxt : '');
}

// géocodage inverse → nom de commune (Nominatim/OSM, gratuit, CORS ok)
async function placeName(lat, lon) {
  try {
    const u = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12'
            + '&lat=' + lat.toFixed(4) + '&lon=' + lon.toFixed(4);
    const r = await fetch(u);
    if (!r.ok) return null;
    const a = (await r.json()).address || {};
    return a.village || a.town || a.city || a.municipality || a.county || null;
  } catch (e) { return null; }
}
function qnhError(msg) {
  qnhBox.classList.remove('load');
  qnhBox.classList.add('err');
  qnhVal.innerHTML = '––––<span class="u">hPa</span>';
  qnhMeta.innerHTML = msg;
}

async function loadQnh() {
  qnhBox.classList.add('load');
  qnhBox.classList.remove('err');
  qnhMeta.textContent = 'Localisation…';

  if (!navigator.geolocation) { qnhError('Géolocalisation indisponible'); return; }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude: lat, longitude: lon } = pos.coords;
    qnhMeta.textContent = 'Lecture pression…';

    const url = 'https://api.open-meteo.com/v1/forecast'
              + '?latitude=' + lat.toFixed(4)
              + '&longitude=' + lon.toFixed(4)
              + '&current=pressure_msl';

    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const hpa = data && data.current && data.current.pressure_msl;
      if (hpa == null) { qnhError('Pression indisponible'); return; }

      // âge de la donnée (heure de l'obs courante renvoyée par l'API)
      let ageMin = null;
      const t = data.current.time;
      if (t) {
        const obs = Date.parse(t);   // ISO local ou epoch selon réglage
        if (!isNaN(obs)) ageMin = Math.max(0, Math.round((Date.now() - obs) / 60000));
      }
      // affiche d'abord le QNH, puis complète avec le lieu dès qu'il arrive
      setQnh(hpa, ageMin, null);
      const place = await placeName(lat, lon);
      if (place) setQnh(hpa, ageMin, place);
    } catch (e) {
      qnhError('Réseau indisponible<br><span style="opacity:.7">' + e.message + '</span>');
    }
  }, (err) => {
    const msgs = { 1: 'Position refusée', 2: 'Position indisponible', 3: 'Délai dépassé' };
    qnhError(msgs[err.code] || 'Erreur de position');
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
}

document.getElementById('qnhRefresh').addEventListener('click', loadQnh);
loadQnh();


/* ============================================================
   3) ZONE DE SAISIE — persistance best-effort (localStorage → mémoire)
   ============================================================ */
const note = document.getElementById('note');
const KEY = 'memo-note';
let mem = '';
try { const v = localStorage.getItem(KEY); if (v != null) note.value = v; }
catch (e) { note.value = mem; }   // file:// / content:// : localStorage bloqué

note.addEventListener('input', () => {
  mem = note.value;
  try { localStorage.setItem(KEY, note.value); } catch (e) {}
});
document.getElementById('clrNote').addEventListener('click', () => {
  note.value = ''; mem = '';
  try { localStorage.removeItem(KEY); } catch (e) {}
  note.focus();
});
</script>
</body>
</html>
