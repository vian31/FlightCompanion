<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Météo</title>
<style>
  :root {
    --ink: #17140f;
    --paper: #f6f2e9;
    --accent: #3b5c47;
    --accent-soft: #e3ead9;
    --muted: #8a8172;
    --brown: #7a4a22;
    --line: #e7e0d1;
    --red: #b23b2f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header {
    padding: 20px 22px 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .sunset-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    color: #2f6fb2;
    font-variant-numeric: tabular-nums;
  }
  .sunset-badge .moon { font-size: 26px; color: #2f6fb2; }
  .sunset-badge .t { font-weight: 800; color: #2f6fb2; }

  .scroll { flex: 1; overflow-y: auto; padding: 14px 22px 40px; }

  /* station récupérée, tout en haut */
  .station {
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  /* pastilles de sélection des 3 stations proches */
  .picker {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .picker .pill {
    flex: 1 1 0;
    min-width: 0;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 8px 6px;
    font-size: 16px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
    text-align: center;
    overflow: hidden;
  }
  .picker .pill .pi { font-weight: 800; color: var(--accent); letter-spacing: 0.03em; }
  .picker .pill .pc {
    font-size: 16px; opacity: 0.8;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker .pill.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .picker .pill.active .pi, .picker .pill.active .pc { color: var(--paper); }
  .picker .pill.wait { opacity: 0.5; }
  /* station aux données périmées : pastille rouge, texte barré */
  .picker .pill.stale {
    background: var(--red);
    border-color: var(--red);
  }
  .picker .pill.stale .pi, .picker .pill.stale .pc {
    color: #fff;
    text-decoration: line-through;
  }
  .picker .pill.stale.active {
    background: var(--red);
    border-color: var(--red);
  }
  /* blocs de données périmées : contour pointillé, atténués */
  .blocks.stale .block {
    border-style: dashed;
    border-color: var(--red);
    opacity: 0.55;
  }
  .blocks.stale .block .big,
  .blocks.stale .block .pair .v,
  .blocks.stale .wind-readout { color: var(--red); }
  .station .icao { font-weight: 800; color: var(--accent); font-size: 18px; letter-spacing: 0.04em; }
  .station .city { color: var(--ink); }
  .station .age { display: block; font-size: 16px; opacity: 0.8; margin-top: 2px; }
  .station .age.stale { color: var(--red); opacity: 1; font-weight: 700; }
  .station .fr {
    display: inline-block;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .fr.VFR  { background: #2f8a3b; }
  .fr.MVFR { background: #2f6fb2; }
  .fr.IFR  { background: #b23b2f; }
  .fr.LIFR { background: #8a3b8a; }

  /* clé AVWX */
  .keybox {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 18px;
  }
  .keybox h3 { font-size: 16px; margin-bottom: 8px; }
  .keybox p { font-size: 16px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .keybox p a { color: var(--accent); }
  .keybox .row { display: flex; gap: 8px; }
  .keybox input {
    flex: 1; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; font-family: inherit; outline: none;
  }
  .keybox input:focus { border-color: var(--accent); }
  .keybox button {
    background: var(--accent); color: var(--paper); border: none; border-radius: 10px;
    padding: 0 18px; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  /* trois blocs de données côte à côte / empilés, sans titre */
  .blocks { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
  .brow { display: flex; gap: 12px; }
  .block {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; align-items: center;
    justify-content: center;
  }
  .block.qnh, .block.temp, .block.ceil, .block.vis { flex: 1; }
  .block .big {
    font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .block .big .u { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .block .cap { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; }
  .block .pair { display: flex; gap: 20px; }
  .block .pair .one { text-align: center; }
  .block .pair .one .lab { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .block .pair .one .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }

  .block.wind { width: 100%; padding: 6px 16px 10px; }
  .rose { width: 220px; height: 187px; display: block; margin: -4px 0; }
  .wind-readout { margin-top: 4px; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
  .wind-readout .u2 { font-size: 18px; font-weight: 600; color: var(--muted); }
  .wind-readout .gust { color: var(--red); }
  .cavok { color: #2f8a3b; font-weight: 800; }

  .load .big, .load .pair, .load .rose { opacity: 0.4; }

  /* ---- ATIS simplifié ---- */
  .sect-title { font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 4px 0 10px; }
  .atis { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 20px; margin-bottom: 26px; }
  .atis .freq { text-align: center; font-size: 16px; color: var(--muted); margin-bottom: 16px; }
  .atis .freq b { color: var(--accent); font-size: 18px; letter-spacing: 0.02em; }
  .atis .duo { display: flex; gap: 16px; }
  .atis .duo .field { flex: 1; }
  .atis .field > .k { font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; text-align: center; }
  .drum { height: 132px; position: relative; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent); touch-action: none; user-select: none; }
  .drum .list { position: absolute; left: 0; right: 0; top: 0; }
  .drum .it { height: 44px; line-height: 44px; text-align: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); transition: color .15s, transform .15s; }
  .drum .it.sel { color: var(--accent); transform: scale(1.12); }
  .drum .band { position: absolute; left: 8px; right: 8px; top: 44px; height: 44px; border-top: 2px solid var(--accent-soft); border-bottom: 2px solid var(--accent-soft); pointer-events: none; border-radius: 8px; }

  /* ---- Notes ---- */
  .note-wrap { margin-bottom: 10px; }
  .note-wrap .cap { font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .note-wrap .clr { font-size: 16px; letter-spacing: 0.04em; color: var(--brown); text-transform: none; cursor: pointer; }
  textarea.note { width: 100%; min-height: 160px; resize: vertical; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-family: inherit; font-size: 20px; line-height: 1.5; color: var(--ink); outline: none; }
  textarea.note:focus { border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Météo</h1>
    <div class="sunset-badge"><span class="moon">☾</span><span class="t" id="sunsetT">--:--</span></div>
  </header>

  <div class="scroll">

    <!-- pastilles de sélection : 3 stations les plus proches -->
    <div class="picker" id="picker"></div>

    <!-- station récupérée -->
    <div class="station" id="station">Localisation…</div>

    <!-- clé AVWX (option 2) -->
    <div class="keybox" id="keybox" style="display:none">
      <h3>Clé AVWX requise</h3>
      <p>Observations METAR via AVWX. Crée une clé gratuite sur
         <a href="https://account.avwx.rest" target="_blank" rel="noopener">account.avwx.rest</a>,
         puis colle-la ici. Elle reste sur ton téléphone.</p>
      <div class="row">
        <input type="text" id="keyInput" placeholder="colle ta clé AVWX" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="keySave">OK</button>
      </div>
    </div>

    <!-- trois blocs : QNH + Température (ligne 1), Vent (ligne 2) -->
    <div class="blocks" id="blocks">
      <div class="brow">
        <div class="block qnh load" id="blkQnh">
          <div class="big" id="qnhVal">––––<span class="u">hPa</span></div>
          <div class="cap">QNH</div>
        </div>
        <div class="block temp load" id="blkTemp">
          <div class="pair">
            <div class="one"><div class="lab">Temp</div><div class="v" id="tVal">—</div></div>
            <div class="one"><div class="lab">Rosée</div><div class="v" id="dVal">—</div></div>
          </div>
          <div class="cap">°C</div>
        </div>
      </div>
      <div class="brow">
        <div class="block wind load" id="blkWind">
          <svg class="rose" id="rose" viewBox="0 18 240 204"></svg>
          <div class="wind-readout" id="windReadout">—</div>
        </div>
      </div>
      <div class="brow">
        <div class="block ceil load" id="blkCeil">
          <div class="big" id="ceilVal">—</div>
          <div class="cap">Plafond</div>
        </div>
        <div class="block vis load" id="blkVis">
          <div class="big" id="visVal">—</div>
          <div class="cap">Visibilité</div>
        </div>
      </div>
    </div>

    <!-- texte mis en forme : déplacé dans un autre onglet -->

    <!-- ATIS simplifié -->
    <div class="sect-title">ATIS — Muret</div>
    <div class="atis">
      <div class="freq">Fréquence <b>124.58</b> MHz</div>
      <div class="duo">
        <div class="field"><div class="k">Indicatif</div><div class="drum" id="drumInd"><div class="list"></div><div class="band"></div></div></div>
        <div class="field"><div class="k">Piste</div><div class="drum" id="drumRwy"><div class="list"></div><div class="band"></div></div></div>
      </div>
    </div>

    <!-- notes -->
    <div class="note-wrap">
      <div class="cap"><span>Notes</span><span class="clr" id="clrNote">effacer</span></div>
      <textarea class="note" id="note"></textarea>
    </div>

  </div>

<script>
const MURET = { lat: 43.4486, lon: 1.2633 };
const rad = Math.PI / 180, deg = 180 / Math.PI;

/* ---------- 2) CLÉ AVWX ---------- */
const KEY_AVWX='avwx-token';
function getKey(){try{return localStorage.getItem(KEY_AVWX)||'';}catch(e){return '';}}
function setKey(v){try{localStorage.setItem(KEY_AVWX,v);}catch(e){}}
function clearKey(){try{localStorage.removeItem(KEY_AVWX);}catch(e){}}
const keybox=document.getElementById('keybox');
function refreshKeybox(){keybox.style.display=getKey()?'none':'block';}
document.getElementById('keySave').addEventListener('click',()=>{
  const v=document.getElementById('keyInput').value.trim();if(!v)return;
  setKey(v);document.getElementById('keyInput').value='';refreshKeybox();start();
});

/* ---------- 3) COUCHER DU SOLEIL ---------- */
function sunsetUTCmin(date,lat,lon){
  const start=Date.UTC(date.getUTCFullYear(),0,0);
  const doy=Math.floor((Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate())-start)/86400000);
  const zenith=90.833,lngHour=lon/15;const tA=doy+((18-lngHour)/24);
  const M=(0.9856*tA)-3.289;let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634;L=((L%360)+360)%360;
  let RA=deg*Math.atan(0.91764*Math.tan(L*rad));RA=((RA%360)+360)%360;RA=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15;
  const sinDec=0.39782*Math.sin(L*rad);const cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(zenith*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
  if(cosH<-1||cosH>1)return null;const H=(deg*Math.acos(cosH))/15;const T=H+RA-(0.06571*tA)-6.622;
  return ((T-lngHour)%24+24)%24*60;
}
function fmtMinLocal(utcMin){const off=-new Date().getTimezoneOffset();let lm=((utcMin+off)%1440+1440)%1440;const h=Math.floor(lm/60),m=Math.round(lm%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function renderSunset(lat,lon){const ss=sunsetUTCmin(new Date(),lat,lon);document.getElementById('sunsetT').textContent=ss==null?'--:--':fmtMinLocal(ss);}
renderSunset(MURET.lat,MURET.lon);

/* ---------- 4) ROSE DES VENTS ---------- */
const rose=document.getElementById('rose');
const CX=120,CY=120,R=92,F_FULL=20;   // flèche max à 20 kt
function baseRose(extra, noDot){
  let s='';
  s+='<circle cx="120" cy="120" r="92" fill="none" stroke="#e3ead9" stroke-width="2"/>';
  s+='<circle cx="120" cy="120" r="46" fill="none" stroke="#eee6d6" stroke-width="1"/>';
  for(let a=0;a<360;a+=10){const major=(a%30===0);const r1=major?80:86,r2=92;
    const x1=CX+r1*Math.sin(a*rad),y1=CY-r1*Math.cos(a*rad),x2=CX+r2*Math.sin(a*rad),y2=CY-r2*Math.cos(a*rad);
    s+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#c9c0ad" stroke-width="'+(major?1.6:0.8)+'"/>';}
  for(const [lab,a] of [['N',0],['E',90],['S',180],['O',270]]){const x=CX+64*Math.sin(a*rad),y=CY-64*Math.cos(a*rad);
    s+='<text x="'+x.toFixed(1)+'" y="'+(y+5).toFixed(1)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#8a8172">'+lab+'</text>';}
  s+=(extra||'');
  if(!noDot) s+='<circle cx="120" cy="120" r="4" fill="#3b5c47"/>';
  rose.innerHTML=s;
}
// flèche de provenance : part du bord (côté d'où vient le vent) vers le centre
function arrowSvg(dirFrom,force){
  const tt=Math.max(0,Math.min(1,(force)/F_FULL));       // 0..1, saturé à 20 kt
  const rr=24+tt*(R-24);
  const tail={x:CX+rr*Math.sin(dirFrom*rad),y:CY-rr*Math.cos(dirFrom*rad)};
  const head={x:CX+10*Math.sin(dirFrom*rad),y:CY-10*Math.cos(dirFrom*rad)};
  const ah=13,aw=7;const dx=head.x-tail.x,dy=head.y-tail.y;const len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len,px=-uy,py=ux;
  const base={x:head.x-ah*ux,y:head.y-ah*uy};
  const p1={x:base.x+aw*px,y:base.y+aw*py},p2={x:base.x-aw*px,y:base.y-aw*py};
  let s='';
  s+='<line x1="'+tail.x.toFixed(1)+'" y1="'+tail.y.toFixed(1)+'" x2="'+base.x.toFixed(1)+'" y2="'+base.y.toFixed(1)+'" stroke="#3b5c47" stroke-width="4.5" stroke-linecap="round"/>';
  s+='<polygon points="'+head.x.toFixed(1)+','+head.y.toFixed(1)+' '+p1.x.toFixed(1)+','+p1.y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+'" fill="#3b5c47"/>';
  return s;
}
// secteur colorié entre deux caps (vent variable) : v1→v2 dans le sens horaire
function sectorSvg(a1,a2){
  let span=((a2-a1)%360+360)%360; if(span===0) span=360;
  const large=span>180?1:0;
  const rOut=R;
  const x1=CX+rOut*Math.sin(a1*rad),y1=CY-rOut*Math.cos(a1*rad);
  const x2=CX+rOut*Math.sin(a2*rad),y2=CY-rOut*Math.cos(a2*rad);
  return '<path d="M'+CX+' '+CY+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+
         ' A'+rOut+' '+rOut+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" '+
         'fill="rgba(59,92,71,0.18)" stroke="#3b5c47" stroke-width="1.5"/>';
}
function centerText(txt,color){
  return '<text x="120" y="128" text-anchor="middle" font-size="30" font-weight="800" fill="'+color+'">'+txt+'</text>';
}

// Affiche le vent à partir d'un objet {calm, vrb, from, to, dir, speed, gust}
function renderWind(w){
  const ro=document.getElementById('windReadout');
  if(!w || w.speed==null){ baseRose(''); ro.textContent='—'; return; }

  if(w.calm){ baseRose(centerText('CALME','#3b5c47'), true); ro.innerHTML='Calme'; return; }

  if(w.vrb && w.from!=null && w.to!=null){
    // vent variable avec plage de directions : quartier colorié + force au centre
    const force = w.gust ? (w.speed+' G '+w.gust) : (''+w.speed);
    const col = w.gust ? '#b23b2f' : '#3b5c47';
    baseRose(sectorSvg(w.from,w.to)+centerText(force,col), true);
    ro.innerHTML = 'VRB '+String(w.from).padStart(3,'0')+'–'+String(w.to).padStart(3,'0')+'° · '
                 + (w.gust ? (w.speed+' <span class="gust">G '+w.gust+'</span>') : w.speed) + ' <span class="u2">kt</span>';
    return;
  }

  if(w.vrb){
    // variable sans plage précise : pas de direction fiable → cercle + force au centre
    const force = w.gust ? (w.speed+' G '+w.gust) : (''+w.speed);
    const col = w.gust ? '#b23b2f' : '#3b5c47';
    baseRose('<circle cx="120" cy="120" r="92" fill="rgba(59,92,71,0.10)"/>'+centerText(force,col), true);
    ro.innerHTML = 'VRB · ' + (w.gust ? (w.speed+' <span class="gust">G '+w.gust+'</span>') : w.speed) + ' <span class="u2">kt</span>';
    return;
  }

  // vent établi : flèche (+ secteur colorié derrière si plage de variation notée)
  const sector = (w.from!=null && w.to!=null) ? sectorSvg(w.from, w.to) : '';
  baseRose(sector + arrowSvg(w.dir, w.speed));
  let txt = String(w.dir).padStart(3,'0')+'° <span class="u2">/</span> '+w.speed+' <span class="u2">kt</span>';
  if(w.from!=null && w.to!=null) txt += ' <span class="u2">(</span>'+String(w.from).padStart(3,'0')+'–'+String(w.to).padStart(3,'0')+'°<span class="u2">)</span>';
  if(w.gust) txt += ' <span class="gust">G '+w.gust+'</span>';
  ro.innerHTML = txt;
}
baseRose('');

// Plafond : plus basse couche BKN ou OVC (en centaines de pieds -> pieds).
// Renvoie une chaîne d'affichage.
function parseCeiling(d){
  const clouds=Array.isArray(d.clouds)?d.clouds:[];
  let ceil=null;
  for(const c of clouds){
    if((c.type==='BKN'||c.type==='OVC') && c.altitude!=null){
      if(ceil==null || c.altitude<ceil) ceil=c.altitude;
    }
  }
  if(ceil!=null) return (ceil*100).toLocaleString('fr-FR')+'<span class="u"> ft</span>';
  // pas de plafond : ciel dégagé / few / sct
  if(d.visibility && d.visibility.repr==='CAVOK') return '<span class="cavok">CAVOK</span>';
  return 'NSC';   // No Significant Cloud / pas de plafond significatif
}

// Visibilité : gère CAVOK, 9999 (>=10 km), valeurs en mètres ou SM.
function parseVis(d){
  const v=d.visibility;
  if(!v) return '—';
  if(v.repr==='CAVOK') return '<span class="cavok">CAVOK</span>';
  if(v.repr==='9999' || v.value===9999) return '≥10<span class="u"> km</span>';
  if(v.value==null) return (v.repr||'—');
  const unit=(d.units&&d.units.visibility)?d.units.visibility:'m';
  if(unit==='m'){
    if(v.value>=1000) return (v.value/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+'<span class="u"> km</span>';
    return v.value+'<span class="u"> m</span>';
  }
  // sm (statute miles) ou autre
  return v.value+'<span class="u"> '+unit+'</span>';
}

/* ---------- 5) MÉTÉO OBSERVÉE (AVWX, station la plus proche) ---------- */
const blkQnh=document.getElementById('blkQnh'),blkTemp=document.getElementById('blkTemp'),blkWind=document.getElementById('blkWind');
const blkCeil=document.getElementById('blkCeil'),blkVis=document.getElementById('blkVis');
function setLoading(on){[blkQnh,blkTemp,blkWind,blkCeil,blkVis].forEach(b=>b&&b.classList.toggle('load',on));}

function altimToHpa(alt){if(!alt||alt.value==null)return null;let v=alt.value;if(v<100)v=v*33.8639;return Math.round(v);}
function fmtAge(obsIso, refIso){
  const t=Date.parse(obsIso);
  if(isNaN(t)) return '';
  if(!refIso) return '';
  const ref=Date.parse(refIso);
  if(isNaN(ref)) return '';
  const min=Math.round((ref-t)/60000);
  if(min<0) return '';                 // futur = anormal
  if(min<1) return "à l'instant";
  if(min<60) return 'il y a '+min+' min';
  const h=Math.floor(min/60), m=min%60;
  if(min<1440) return 'il y a '+h+' h '+String(m).padStart(2,'0');
  const days=Math.floor(min/1440);
  return 'il y a '+days+' j';           // âge en jours pour données périmées
}
// heure Zulu du METAR depuis time.repr (ex "140830Z" -> "08:30Z"), fiable et sans horloge locale
function zuluFromRepr(repr){
  if(!repr) return '';
  const m=String(repr).match(/^(\d{2})(\d{2})(\d{2})Z?$/);
  if(!m) return '';
  return m[2]+':'+m[3]+'Z';
}

// Extrait le vent depuis le JSON AVWX en couvrant les formats du METAR
function parseWind(d){
  const spd = d.wind_speed && d.wind_speed.value!=null ? d.wind_speed.value : null;
  if(spd==null) return null;
  const out = { speed: spd, gust: (d.wind_gust && d.wind_gust.value!=null)? d.wind_gust.value : null };
  if(spd===0){ out.calm=true; return out; }
  // plage de variation (VRB entre deux caps, ex "260V320")
  let vFrom=null,vTo=null;
  if(d.wind_variable_direction && d.wind_variable_direction.length>=2){
    vFrom=d.wind_variable_direction[0].value; vTo=d.wind_variable_direction[1].value;
  }
  const dirRepr = d.wind_direction ? d.wind_direction.repr : null;
  const dirVal  = d.wind_direction && d.wind_direction.value!=null ? d.wind_direction.value : null;
  if(dirRepr==='VRB'){
    // VRB pur : pas de direction franche
    out.vrb=true;
    if(vFrom!=null&&vTo!=null){ out.from=vFrom; out.to=vTo; }
    return out;
  }
  if(dirVal!=null && vFrom!=null && vTo!=null){
    // direction franche AVEC plage de variation : flèche + secteur
    out.dir=dirVal; out.from=vFrom; out.to=vTo; return out;
  }
  if(dirVal!=null){ out.dir=dirVal; return out; }
  // direction absente → variable de fait
  out.vrb=true; return out;
}

// Détecte des données périmées : warning AVWX de cache, ou observation > 3 h
function isStale(d){
  if(d && d.meta && d.meta.warning) return true;
  const obsT=d&&d.time&&d.time.dt?Date.parse(d.time.dt):NaN;
  const refT=d&&d.meta&&d.meta.timestamp?Date.parse(d.meta.timestamp):NaN;
  if(!isNaN(obsT)&&!isNaN(refT)){
    return Math.round((refT-obsT)/60000) > 180;
  }
  return false;
}

// Affiche un METAR déjà récupéré (objet JSON AVWX) dans les blocs
function showMetar(d){
  const icao=d.station||'';
  let city='';
  if(d.info){ city=d.info.city||d.info.name||''; }
  const age=fmtAge(d.time&&d.time.dt?d.time.dt:null, d.meta&&d.meta.timestamp?d.meta.timestamp:null);
  const zulu=zuluFromRepr(d.time&&d.time.repr?d.time.repr:'');

  // données périmées : AVWX signale un cache dépassé, ou l'observation est trop ancienne
  const obsT=d.time&&d.time.dt?Date.parse(d.time.dt):NaN;
  const refT=d.meta&&d.meta.timestamp?Date.parse(d.meta.timestamp):NaN;
  const ageMin=(!isNaN(obsT)&&!isNaN(refT))?Math.round((refT-obsT)/60000):null;
  const stale = isStale(d);

  const fr = d.flight_rules || '';
  const frPill = fr ? '<span class="fr '+fr+'">'+fr+'</span>' : '';

  let timeHtml;
  if(stale){
    timeHtml = '<span class="age stale">⚠ '+(zulu?zulu+' · ':'')+(age||'donnée périmée')+' — station silencieuse</span>';
  } else {
    const timeTxt = zulu ? (zulu + (age ? ' · ' + age : '')) : age;
    timeHtml = timeTxt ? '<span class="age">'+timeTxt+'</span>' : '';
  }

  document.getElementById('station').innerHTML =
    '<span class="icao">'+icao+'</span>'+(city?' · <span class="city">'+city+'</span>':'')+frPill+timeHtml;

  const hpa=altimToHpa(d.altimeter);
  document.getElementById('qnhVal').innerHTML=(hpa!=null?hpa:'––––')+'<span class="u">hPa</span>';

  const tv=d.temperature&&d.temperature.value!=null?d.temperature.value:null;
  const dv=d.dewpoint&&d.dewpoint.value!=null?d.dewpoint.value:null;
  document.getElementById('tVal').textContent=(tv==null?'—':tv);
  document.getElementById('dVal').textContent=(dv==null?'—':dv);

  document.getElementById('ceilVal').innerHTML=parseCeiling(d);
  document.getElementById('visVal').innerHTML=parseVis(d);

  renderWind(parseWind(d));

  // état périmé : marque les blocs (données en pointillé) et mémorise sur la station active
  document.getElementById('blocks').classList.toggle('stale', !!stale);
  if(activeIcao) staleByIcao[activeIcao]=!!stale;
  renderPicker();

  setLoading(false);
}

// Récupère le METAR d'un ICAO (renvoie l'objet JSON, ou null en cas d'échec)
async function fetchOne(icao){
  const key=getKey();
  const url='https://avwx.rest/api/metar/'+icao+'?options=info&onfail=cache';
  const r=await fetch(url,{headers:{'Authorization':key}});
  if(r.status===401||r.status===403){ const e=new Error('auth'); e.auth=true; throw e; }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// Récupère les N stations les plus proches (reporting) → [{icao, city}]
async function fetchNearest(lat,lon,n){
  const key=getKey();
  const url='https://avwx.rest/api/station/near/'+lat.toFixed(4)+','+lon.toFixed(4)+'?n='+n+'&reporting=true';
  const r=await fetch(url,{headers:{'Authorization':key}});
  if(r.status===401||r.status===403){ const e=new Error('auth'); e.auth=true; throw e; }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const arr=await r.json();
  if(!Array.isArray(arr)) return [];
  return arr.map(o=>{
    const s=o.station||o;
    let city=s.city||s.name||'';
    if(city.indexOf('/')>=0) city=city.split('/').pop().trim();  // "Toulouse/Blagnac" -> "Blagnac"
    return { icao: s.icao||s.gps||'', city: city };
  }).filter(x=>x.icao);
}

// état des 3 stations et de leurs METAR
let stations=[];        // [{icao, city}]
let metars={};          // icao -> JSON METAR
let staleByIcao={};     // icao -> true si données périmées
let activeIcao=null;

function renderPicker(){
  const p=document.getElementById('picker');
  p.innerHTML='';
  stations.forEach(st=>{
    const el=document.createElement('div');
    el.className='pill'+(st.icao===activeIcao?' active':'')+(metars[st.icao]?'':' wait')+(staleByIcao[st.icao]?' stale':'');
    el.innerHTML='<span class="pi">'+st.icao+'</span>'+(st.city?'<span class="pc">'+st.city+'</span>':'');
    el.addEventListener('click',()=>{
      activeIcao=st.icao;
      renderPicker();
      if(metars[st.icao]) showMetar(metars[st.icao]);
      else { setLoading(true); document.getElementById('station').textContent='Lecture METAR…'; }
    });
    p.appendChild(el);
  });
}

async function loadStations(lat,lon){
  setLoading(true);
  document.getElementById('station').textContent='Stations proches…';
  try{
    stations=await fetchNearest(lat,lon,3);
    if(stations.length===0){ document.getElementById('station').textContent='Aucune station à proximité'; setLoading(false); return; }
    activeIcao=stations[0].icao;
    renderPicker();
    // charge les 3 METAR d'un coup, en parallèle
    stations.forEach(async st=>{
      try{
        const d=await fetchOne(st.icao);
        metars[st.icao]=d;
        staleByIcao[st.icao]=isStale(d);   // statut connu dès réception, pas au tap
        renderPicker();
        if(st.icao===activeIcao) showMetar(d);
      }catch(e){
        if(e.auth){ document.getElementById('station').textContent='Clé refusée'; clearKey(); refreshKeybox(); }
      }
    });
  }catch(e){
    if(e.auth){ document.getElementById('station').textContent='Clé refusée'; clearKey(); refreshKeybox(); }
    else document.getElementById('station').textContent='Réseau indisponible ('+e.message+')';
    setLoading(false);
  }
}

/* ---------- 6) DÉMARRAGE : géoloc → 3 stations proches ---------- */
function start(){
  refreshKeybox();
  if(!getKey()){ document.getElementById('station').textContent='Clé AVWX requise'; return; }
  if(navigator.geolocation){
    document.getElementById('station').textContent='Localisation…';
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ renderSunset(pos.coords.latitude,pos.coords.longitude); loadStations(pos.coords.latitude,pos.coords.longitude); },
      ()=>{ renderSunset(MURET.lat,MURET.lon); loadStations(MURET.lat,MURET.lon); },
      { enableHighAccuracy:false, timeout:12000, maximumAge:300000 }
    );
  } else {
    loadStations(MURET.lat,MURET.lon);
  }
}
start();

/* ---------- 7) ATIS drums ---------- */
const ITEM_H=44;
function buildDrum(id,values,startIndex){
  const drum=document.getElementById(id),list=drum.querySelector('.list');let idx=startIndex;
  list.innerHTML='<div class="it pad">&nbsp;</div>'+values.map(v=>'<div class="it">'+v+'</div>').join('')+'<div class="it pad">&nbsp;</div>';
  const items=[...list.querySelectorAll('.it')].filter(el=>!el.classList.contains('pad'));
  let y=0,startY=0,dragging=false,baseY=0;
  function setIdx(i,animate){idx=Math.max(0,Math.min(values.length-1,i));y=-idx*ITEM_H;list.style.transition=animate?'transform .18s':'none';list.style.transform='translateY('+y+'px)';items.forEach((el,k)=>el.classList.toggle('sel',k===idx));}
  drum.addEventListener('touchstart',e=>{dragging=true;startY=e.touches[0].clientY;baseY=y;list.style.transition='none';},{passive:true});
  drum.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();const dy=e.touches[0].clientY-startY;list.style.transform='translateY('+(baseY+dy)+'px)';},{passive:false});
  drum.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const dy=e.changedTouches[0].clientY-startY;setIdx(Math.round((-(baseY+dy))/ITEM_H),true);});
  drum.addEventListener('mousedown',e=>{dragging=true;startY=e.clientY;baseY=y;list.style.transition='none';e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(!dragging)return;const dy=e.clientY-startY;list.style.transform='translateY('+(baseY+dy)+'px)';});
  window.addEventListener('mouseup',e=>{if(!dragging)return;dragging=false;const dy=e.clientY-startY;setIdx(Math.round((-(baseY+dy))/ITEM_H),true);});
  setIdx(startIndex,false);
}
buildDrum('drumInd',['A','B','C','D','E','F','G'],0);
buildDrum('drumRwy',['12','30'],0);

/* ---------- 8) NOTES ---------- */
const note=document.getElementById('note'),NKEY='memo-note';
try{const v=localStorage.getItem(NKEY);if(v!=null)note.value=v;}catch(e){}
function saveNote(){try{localStorage.setItem(NKEY,note.value);}catch(e){}}
note.addEventListener('input',saveNote);
// filets de sécurité : sauvegarde aussi quand l'app passe en arrière-plan ou se ferme
note.addEventListener('blur',saveNote);
window.addEventListener('pagehide',saveNote);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNote(); });
// quand le clavier s'ouvre, ramener le champ dans la zone visible
note.addEventListener('focus',()=>{
  setTimeout(()=>{ try{ note.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){ note.scrollIntoView(); } }, 300);
});
// si l'API visualViewport est dispo (Android/iOS récents), réagir au redimensionnement dû au clavier
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    if(document.activeElement===note){
      try{ note.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
    }
  });
}
document.getElementById('clrNote').addEventListener('click',()=>{note.value='';try{localStorage.removeItem(NKEY);}catch(e){}note.focus();});
